# 本地/单机部署：server + caddy（反代 + 自动 TLS）
# `docker compose up -d --build` 起来后，浏览器访问 http://localhost 即可（验收 6）。

services:
  server:
    image: agentlink-server:latest
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 3000
      # 这两个必须显式给：缺失时服务端直接退出，不许静默用默认值
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET 未设置，请在 .env 里生成一个（openssl rand -hex 32）}
      AGENT_TOKEN_PEPPER: ${AGENT_TOKEN_PEPPER:?AGENT_TOKEN_PEPPER 未设置（openssl rand -hex 16）}
      DATABASE_PATH: /data/agentlink.db
      UPLOADS_DIR: /data/uploads
      # 单个附件上限：默认 20 MiB；0 = 不限制
      MAX_ATTACHMENT_BYTES: ${MAX_ATTACHMENT_BYTES:-20971520}
      PUBLIC_DIR: /app/public
      LOG_LEVEL: ${LOG_LEVEL:-info}
      # M11 插件钩子（可选）
      HOOKS_MODULE: ${HOOKS_MODULE:-}
    volumes:
      - db:/data
    expose:
      - '3000'
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/healthz').then(r=>r.json()).then(j=>process.exit(j.ok===true?0:1)).catch(()=>process.exit(1))"
      interval: 15s
      timeout: 5s
      start_period: 20s
      retries: 5

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      server:
        condition: service_healthy
    ports:
      - '${HTTP_PORT:-80}:80'
      - '${HTTPS_PORT:-443}:443'
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  # 两个命名卷：SQLite 库与附件（验收 6：重启不丢数据）
  db:
  caddy_data:
  caddy_config: