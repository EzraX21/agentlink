# 前后端分离部署：三个容器
#
#   web     nginx + 构建好的前端产物（对外唯一入口）
#   server  API + WebSocket（不托管前端）
#   caddy   反向代理 + 自动 TLS（公网部署时用；本地可不起）
#
# 浏览器只与 web 通信，web 把 /api 与 /ws 反代给 server —— 对浏览器来说仍是**同源**，
# 所以默认不需要 CORS。把 web 换成 CDN 时，才需要给 server 设 CORS_ORIGINS。
#
# 起法：
#   docker compose up -d --build
#   浏览器访问 http://localhost
#
# 只起后端（前端另放 CDN 时）：
#   docker compose up -d server

services:
  # ---- 服务端：API + WebSocket，不含任何前端产物 ----
  server:
    image: agentlink-server:latest
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 3000
      # 这两个必须显式给：缺失时服务端直接退出，不许静默用默认值
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET 未设置，请在 .env 里生成一个（openssl rand -hex 32）}
      AGENT_TOKEN_PEPPER: ${AGENT_TOKEN_PEPPER:?AGENT_TOKEN_PEPPER 未设置（openssl rand -hex 16）}
      DATABASE_PATH: /data/agentlink.db
      UPLOADS_DIR: /data/uploads
      # 单个附件上限：默认 20 MiB；0 = 不限制
      MAX_ATTACHMENT_BYTES: ${MAX_ATTACHMENT_BYTES:-20971520}
      # 本镜像不托管前端（前端在 web 服务里）
      PUBLIC_DIR: ''
      # 前后端**真跨域**时才需要（客户端放 CDN）。本 compose 由 web 反代，同源，留空。
      CORS_ORIGINS: ${CORS_ORIGINS:-}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      # M11 插件钩子（可选）
      HOOKS_MODULE: ${HOOKS_MODULE:-}
    volumes:
      - db:/data
    expose:
      - '3000'
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/healthz').then(r=>r.json()).then(j=>process.exit(j.ok===true?0:1)).catch(()=>process.exit(1))"
      interval: 15s
      timeout: 5s
      start_period: 20s
      retries: 5

  # ---- 客户端：nginx + 静态产物，反代 /api 与 /ws 到 server ----
  web:
    image: agentlink-web:latest
    build:
      context: .
      dockerfile: Dockerfile.web
    restart: unless-stopped
    depends_on:
      server:
        condition: service_healthy
    environment:
      # nginx 启动时用 envsubst 注入；容器内网用服务名
      AGENTLINK_SERVER: server:3000
      NGINX_PORT: '80'
    ports:
      - '${HTTP_PORT:-8080}:80'
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1:80/healthz']
      interval: 15s
      timeout: 5s
      start_period: 10s
      retries: 5

  # ---- 反向代理 + 自动 TLS（公网部署时用；本地直接访问 web 的端口即可） ----
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    profiles: ['tls']
    depends_on:
      web:
        condition: service_healthy
    ports:
      - '${HTTPS_PORT:-443}:443'
    volumes:
      - ./Caddyfile.tls:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  # SQLite 库与附件（验收 6：重启不丢数据）
  db:
  caddy_data:
  caddy_config:
